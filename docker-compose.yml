name: crm

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - ${PGDATA_PRIMARY:-/mnt/data_main/m2solution_crm/pgdata}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default
      - db-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db-init:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEV_POSTGRES_DB: ${DEV_POSTGRES_DB:-crm_dev}
    volumes:
      - ./deploy/postgres/ensure-extra-db.sh:/ensure-extra-db.sh:ro
    entrypoint: ["/bin/bash", "/ensure-extra-db.sh"]
    restart: on-failure

  db-replica:
    image: postgres:16
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD in .env}
      PRIMARY_HOST: db
      REPLICATION_USER: replicator
      REPLICATION_SLOT: crm_replica
    volumes:
      - ${PGDATA_REPLICA:-/mnt/data_backup/m2solution_crm/pgdata}:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://crm.m2solution.ca}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crm.m2solution.ca}
      SEED_EMAIL: ${SEED_EMAIL:-admin@m2solution.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme}
      COMPANY_NAME: ${COMPANY_NAME:-M2 Solution}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-billing@m2solution.com}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${PROD_WEB_PUBLISH:-10.50.0.2:8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  db-shared:
    name: crm-db
