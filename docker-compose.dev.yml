name: crm-dev

services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${DEV_POSTGRES_DB:-crm_dev}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      PUBLIC_APP_URL: ${DEV_PUBLIC_APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${DEV_CORS_ORIGINS:-http://localhost:5173}
      SEED_EMAIL: ${SEED_EMAIL:-admin@m2solution.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme}
      COMPANY_NAME: ${COMPANY_NAME:-M2 Solution}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-billing@m2solution.com}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      FILES_ROOT: /data/files
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-25000000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - ./backend/app:/app/app
      - ${DEV_FILES_ROOT:-/mnt/data_main/m2solution_crm/files_dev}:/data/files
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - shared-db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:

networks:
  shared-db:
    name: shared-db
    external: true
